<div class="container my-4 pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark m-0">FastOrder S.A.</h2>
            <p class="text-muted small m-0">Elige tu comida favorita</p>
        </div>
        <span class="badge bg-success px-3 py-2">🟢 Online</span>
    </div>

    <!-- Botones de Filtro por Categorías -->
    <div class="d-flex gap-2 overflow-auto pb-2 mb-4 scrollbar-none">
        <button class="btn btn-sm rounded-pill px-3" [class.btn-dark]="selectedCategory === 'todos'"
            [class.btn-outline-dark]="selectedCategory !== 'todos'" (click)="filterCategory('todos')">
            Todos
        </button>
        <button class="btn btn-sm rounded-pill px-3" [class.btn-dark]="selectedCategory === 'hamburguesas'"
            [class.btn-outline-dark]="selectedCategory !== 'hamburguesas'" (click)="filterCategory('hamburguesas')">
            Hamburguesas
        </button>
        <button class="btn btn-sm rounded-pill px-3" [class.btn-dark]="selectedCategory === 'acompañamientos'"
            [class.btn-outline-dark]="selectedCategory !== 'acompañamientos'"
            (click)="filterCategory('acompañamientos')">
            Acompañamientos
        </button>
        <button class="btn btn-sm rounded-pill px-3" [class.btn-dark]="selectedCategory === 'bebidas'"
            [class.btn-outline-dark]="selectedCategory !== 'bebidas'" (click)="filterCategory('bebidas')">
            Bebidas
        </button>
        <button class="btn btn-sm rounded-pill px-3" [class.btn-dark]="selectedCategory === 'postres'"
            [class.btn-outline-dark]="selectedCategory !== 'postres'" (click)="filterCategory('postres')">
            Postres
        </button>
    </div>

    <!-- Listado de Productos-->
    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" *ngFor="let product of filteredProducts">
            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden"
                [routerLink]="['/producto', product.id]" style="cursor: pointer;">
                <img [src]="product.image" class="card-img-top" [alt]="product.name"
                    style="height: 130px; object-fit: cover;">
                <div class="card-body d-flex flex-column p-3">
                    <h6 class="card-title fw-bold text-dark text-truncate mb-1">{{ product.name }}</h6>
                    <p class="card-text text-muted small flex-grow-1"
                        style="font-size: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        {{ product.description }}
                    </p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="fw-bold text-danger">S/. {{ product.price.toFixed(2) }}</span>
                        <button
                            class="btn btn-sm btn-dark rounded-circle p-1 d-flex align-items-center justify-content-center"
                            style="width: 32px; height: 32px;" [routerLink]="['/producto', product.id]">
                            +
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- boton flotante para el carrito -->
    <div class="position-fixed bottom-0 end-0 p-4" style="z-index: 1050;" *ngIf="cartItemCount > 0">
        <button class="btn btn-danger rounded-pill shadow-lg px-4 py-3 d-flex align-items-center gap-2 fw-bold"
            routerLink="/carrito">
            <span>🛒 Ver Pedido</span>
            <span class="badge bg-white text-danger rounded-circle px-2">{{ cartItemCount }}</span>
        </button>
    </div>
